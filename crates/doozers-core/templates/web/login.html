{% extends "layout.html" %}

{% block title %}Log in - Doozers{% endblock %}

{% block content %}
<h1>Log in</h1>
<p>This one-time link logs this browser in to Doozers for 30 days. It works once, until
{{ expires }}.</p>
<form method="post" action="/login">
<input type="hidden" name="token" value="{{ token }}">
<button type="submit" class="button-primary">Log in</button>
</form>
{% endblock %}
