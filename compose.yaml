# Doozers and the Docker environment plugin, each in its own container: the engine socket is mounted
# into the plugin's container only. `docker compose up` pulls the published images, and
# `docker compose up --build` builds them from this checkout instead. See
# Docs/user/container.md#run-doozers-with-docker-compose.
#
# Set these in `.env` next to this file:
#
# - CONTAINER_ENGINE_SOCKET: the engine's socket on the host, such as
#   /run/user/1000/podman/podman.sock for rootless Podman.
# - DOOZERS_ENVIRONMENT_DOCKER_TOKEN: the token Doozers authenticates to the plugin with
#   (`openssl rand -hex 32`). doozers.toml refers to it as
#   `{ env = "DOOZERS_ENVIRONMENT_DOCKER_TOKEN" }`.

name: doozers

services:
  doozers:
    image: ghcr.io/jennings/doozers:latest
    build: .
    restart: unless-stopped
    depends_on:
      - doozers-environment-docker
    volumes:
      # Owned by uid and gid 10001, the image's `doozers` user.
      - ./doozers-home:/data
    ports:
      # doozers.toml must set `http_listen = "0.0.0.0:8080"`.
      - 127.0.0.1:8080:8080
    environment:
      DOOZERS_ENVIRONMENT_DOCKER_TOKEN: ${DOOZERS_ENVIRONMENT_DOCKER_TOKEN:?set DOOZERS_ENVIRONMENT_DOCKER_TOKEN in .env}

  doozers-environment-docker:
    image: ghcr.io/jennings/doozers-environment-docker:latest
    build:
      context: .
      dockerfile: plugins/doozers-environment-docker/Dockerfile
    restart: unless-stopped
    volumes:
      - ${CONTAINER_ENGINE_SOCKET:?set CONTAINER_ENGINE_SOCKET in .env}:/var/run/docker.sock
    # Lets the plugin open the socket on SELinux hosts, such as Fedora.
    security_opt:
      - label=disable
    environment:
      DOOZERS_ENVIRONMENT_DOCKER_TOKEN: ${DOOZERS_ENVIRONMENT_DOCKER_TOKEN:?set DOOZERS_ENVIRONMENT_DOCKER_TOKEN in .env}
